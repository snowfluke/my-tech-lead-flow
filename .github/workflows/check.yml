name: check

on:
  push:
    branches: [main]
  pull_request:

# A new push makes the run for the old one useless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The check takes about a minute; a hung download must not bill for hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./check.sh
